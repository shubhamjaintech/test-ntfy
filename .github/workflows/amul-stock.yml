name: Amul Chocolate Whey Stock Alert

on:
  schedule:
    # Check every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Amul stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_stock.py

      - name: Save state
        run: |
          if git diff --quiet -- state.txt; then
            echo "No state change."
            exit 0
          fi

          git config user.name "amul-stock-bot"
          git config user.email "actions@users.noreply.github.com"

          git add state.txt
          git commit -m "chore: update Amul stock state"

          git pull --rebase origin main
          git push

